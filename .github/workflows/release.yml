name: Release Go Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Homebrew formula in this repository is bumped by scripts/release
      # before the tag is created. A separate generated tap can be added later
      # if we split packaging into srivathsan-srinivasan/homebrew-cloudmanager.

      # TODO(packaging): Add Apt / Debian package repository configuration
      # Setup NFPM in .goreleaser.yaml to generate .deb, then push to PPA or custom repo
      
      # TODO(packaging): Add RPM / Yum package publishing
      # Use NFPM module in GoReleaser to produce .rpm

      # TODO(packaging): Add Snapcraft publishing configuration

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
