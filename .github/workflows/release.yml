name: Release Go Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable semver tag to release, for example v1.0.0'
        required: true
        type: string
      skip_tests:
        description: 'Skip go test ./... before tagging'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          version="${raw#v}"
          tag="v${version}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be stable semver like v1.0.0" >&2
            exit 2
          fi
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q "${tag}"; then
            echo "tag ${tag} already exists on origin" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ inputs.skip_tests }}" != "true" ]]; then
            GOCACHE="${GOCACHE:-/tmp/go-build-cache}" go test ./...
          fi
          printf '%s\n' "$version" > VERSION
          VERSION="$version" perl -0pi -e 's#raw\.githubusercontent\.com/vyoogam/cloudmanager/v[0-9]+\.[0-9]+\.[0-9]+/scripts/install#raw.githubusercontent.com/vyoogam/cloudmanager/v$ENV{VERSION}/scripts/install#g; s#go install github\.com/vyoogam/cloudmanager\@v[0-9]+\.[0-9]+\.[0-9]+#go install github.com/vyoogam/cloudmanager@v$ENV{VERSION}#g' README.md
          VERSION="$version" perl -0pi -e 's#CLOUDMANAGER_VERSION:-v[0-9]+\.[0-9]+\.[0-9]+#CLOUDMANAGER_VERSION:-v$ENV{VERSION}#g; s#--version v[0-9]+\.[0-9]+\.[0-9]+#--version v$ENV{VERSION}#g; s#Default: v[0-9]+\.[0-9]+\.[0-9]+#Default: v$ENV{VERSION}#g' scripts/install
          VERSION="$version" perl -0pi -e 's/tag:\s*"v[0-9]+\.[0-9]+\.[0-9]+"/tag: "v$ENV{VERSION}"/g; s/version\s+"[0-9]+\.[0-9]+\.[0-9]+"/version "$ENV{VERSION}"/g' Formula/cloudmanager.rb
          git diff --check
          git add VERSION README.md scripts/install Formula/cloudmanager.rb
          if ! git diff --cached --quiet; then
            git commit -m "release: ${tag}"
          fi
          git tag -a "$tag" -m "$tag"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$tag"

      # The Homebrew formula in this repository is bumped by scripts/release or
      # by the manual workflow before the tag is created. A separate generated
      # tap can be added later if we split packaging into vyoogam/homebrew-cloudmanager.

      # TODO(packaging): Add Apt / Debian package repository configuration
      # Setup NFPM in .goreleaser.yaml to generate .deb, then push to PPA or custom repo
      
      # TODO(packaging): Add RPM / Yum package publishing
      # Use NFPM module in GoReleaser to produce .rpm

      # TODO(packaging): Add Snapcraft publishing configuration

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
